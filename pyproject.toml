[project]
name = "voice-agent-latency-lab"
version = "0.1.0"
description = "Per-turn latency decomposition for a cascaded voice agent, reported at the tail"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "livekit-agents>=1.7.0",
    "livekit-plugins-deepgram>=1.7.0",
    "livekit-plugins-cartesia>=1.7.0",
    "livekit-plugins-google>=1.7.0",
    "livekit-plugins-silero>=1.7.0",
    "livekit-plugins-turn-detector>=1.7.0",
    "python-dotenv>=1.2.3",
    "httpx",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/latency_lab"]
